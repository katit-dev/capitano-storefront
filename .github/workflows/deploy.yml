name: Request satellite deploy

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Digest đã được admin tritruong VPS duyệt, dạng sha256:..."
        required: true
        type: string

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request deployment from VPS gate
        shell: bash
        env:
          IMAGE_DIGEST: ${{ inputs.digest }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Digest không hợp lệ"; exit 1; }
          for name in SERVER_HOST SERVER_USER SERVER_SSH_KEY SERVER_KNOWN_HOSTS; do
            [[ -n "${!name}" ]] || { echo "Thiếu ${name}"; exit 1; }
          done

          key_file="$RUNNER_TEMP/picare-satellite-ssh-key"
          known_hosts_file="$RUNNER_TEMP/picare-satellite-known-hosts"
          printf '%s\n' "$SERVER_SSH_KEY" > "$key_file"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"

          ssh -i "$key_file" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            "$SERVER_USER@$SERVER_HOST" "deploy $IMAGE_DIGEST"
